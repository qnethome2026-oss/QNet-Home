# QNet Home broker config — installed at /etc/mosquitto/conf.d/qnet.conf on the IQ-9075 (T1.1)
#
# Two listeners:
#   11883 — plain MQTT, LAN-wide (0.0.0.0), for nodes/agent (paho-mqtt/aiomqtt)
#   19001 — MQTT-over-WebSockets, for the dashboard and dev/sim.html (mqtt.js)
#
# NON-STANDARD PORTS, deliberately: a teammate's separate stack (iq9_native,
# "QHome") holds the standard :1883 on this board with a live device attached
# (verify/T1.1-blocked.txt — user decided 2026-08-05 to coexist rather than
# evict). Both listeners were round-trip validated on these exact ports from
# the device AND the laptop before this file was pointed at them. When the
# other stack retires: change the two numbers below to 1883/9001, update
# config/house.yaml's mqtt block, `sudo systemctl restart mosquitto`.
#
# allow_anonymous true: no auth on the workshop LAN by design (see DESIGN.md §4 —
# MQTT is the only coupling between devices; this is a closed dev network).

listener 11883 0.0.0.0
protocol mqtt
allow_anonymous true

listener 19001 0.0.0.0
protocol websockets
allow_anonymous true
