# QNet Home broker config — installed at /etc/mosquitto/conf.d/qnet.conf on the IQ-9075 (T1.1)
#
# Two listeners:
#   1883 — plain MQTT, LAN-wide (0.0.0.0), for nodes/agent (paho-mqtt)
#   9001 — MQTT-over-WebSockets, for the dashboard and dev/sim.html (mqtt.js)
#
# allow_anonymous true: no auth on the workshop LAN by design (see DESIGN.md §4 —
# MQTT is the only coupling between devices; this is a closed dev network).

listener 1883 0.0.0.0
protocol mqtt
allow_anonymous true

listener 9001 0.0.0.0
protocol websockets
allow_anonymous true
