[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "qnet"
version = "0.1.0"
description = "QNet Home - a privacy-first, multi-device home safety system"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
dependencies = [
    "paho-mqtt>=2.1",
    "aiomqtt>=2.5",   # asyncio wrapper over paho, not a fifth library
    "pyyaml",
    "httpx",
    "openai",
]

[project.optional-dependencies]
# amqtt is the laptop stand-in for Mosquitto (dev/broker.py) - Windows has no
# mosquitto package, and the spine has to be developable off the hardware.
dev = ["pytest", "amqtt>=0.11"]

[tool.setuptools.packages.find]
include = ["qnet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
